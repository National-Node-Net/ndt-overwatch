# Organisation-wide report hosted in ndt-overwatch, not synchronised into target repositories.

name: OSPO governance report

on:
  push:
    branches:
      - feature/governance-report
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
    inputs:
      excluded_repos:
        description: Repository names to exclude (commas or spaces); defaults to GOVERNANCE_EXCLUDED_REPOS variable
        type: string
        required: false
      human_pr_days:
        description: Days a human PR can stay open before it is reported
        type: number
        default: 30
      dependabot_pr_days:
        description: Days a Dependabot PR can stay open before it is reported
        type: number
        default: 14
      dormant_days:
        description: Days without non-bot activity before a repository is flagged as dormant
        type: number
        default: 180
      release_days:
        description: Days of releases to check for an SBOM asset
        type: number
        default: 90

permissions:
  contents: read

concurrency:
  group: ospo-governance-report
  cancel-in-progress: false

jobs:
  governance-report:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get repository reader token
        id: reader_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: '4265920'
          private-key: ${{ secrets.NODE_NET_REPOSITORY_READER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Get pull request token
        id: pr_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: '4265970'
          private-key: ${{ secrets.NODE_NET_PULL_REQUEST_CONTROLLER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-pull-requests: write

      - name: Get repository settings token
        id: settings_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: '4265891'
          private-key: ${{ secrets.NODE_NET_REPOSITORY_WRITER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write

      - name: Checkout OSPO policies and checklists
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: National-Node-Net/ospo-resources
          ref: develop
          token: ${{ steps.reader_token.outputs.token }}
          path: ospo-resources

      - name: Checkout published OSPO workflow baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: National-Node-Net/ospo-resources
          ref: main
          token: ${{ steps.reader_token.outputs.token }}
          path: ospo-workflows

      - name: Install Conftest
        env:
          CONFTEST_VERSION: '0.71.1'
          CONFTEST_SHA256: c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985
        run: |
          set -euo pipefail
          file="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          curl --proto '=https' --fail -sSL -o "$RUNNER_TEMP/$file" \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/${file}"
          echo "${CONFTEST_SHA256}  $RUNNER_TEMP/$file" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/bin" conftest
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Scheduled runs post PR reminders; manual runs only report.
      - name: Generate governance report
        env:
          GH_TOKEN: ${{ steps.reader_token.outputs.token }}
          PR_TOKEN: ${{ steps.pr_token.outputs.token }}
          SETTINGS_TOKEN: ${{ steps.settings_token.outputs.token }}
          REMINDER_AUTHOR: ${{ steps.pr_token.outputs.app-slug }}[bot]
          HUMAN_PR_DAYS: ${{ github.event.inputs.human_pr_days || '30' }}
          DEPENDABOT_PR_DAYS: ${{ github.event.inputs.dependabot_pr_days || '14' }}
          DORMANT_DAYS: ${{ github.event.inputs.dormant_days || '180' }}
          RELEASE_DAYS: ${{ github.event.inputs.release_days || '90' }}
          EXCLUDED_REPOS: ${{ github.event.inputs.excluded_repos || vars.GOVERNANCE_EXCLUDED_REPOS || '' }}
        run: |
          set -euo pipefail
          args=(
            --human-pr-days "$HUMAN_PR_DAYS"
            --dependabot-pr-days "$DEPENDABOT_PR_DAYS"
            --dormant-days "$DORMANT_DAYS"
            --release-days "$RELEASE_DAYS"
            --exclude-repos "$EXCLUDED_REPOS"
            --output-dir governance-report
          )
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            args+=(--post-reminders --reminder-author "$REMINDER_AUTHOR")
          fi
          python3 tools/governance-report/governance_report.py --source-root ospo-resources --workflow-source-root ospo-workflows "${args[@]}"

      - name: Generate this repository's README badges
        if: ${{ always() && !cancelled() && (github.ref == 'refs/heads/feature/governance-report' || github.ref == 'refs/heads/main') }}
        env:
          BADGE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 tools/governance-report/governance_badges.py \
            --report governance-report/report.json \
            --repository "$BADGE_REPOSITORY" \
            --output-dir governance-badges

      - name: Bundle locally stored status icons
        if: ${{ always() && !cancelled() && (github.ref == 'refs/heads/feature/governance-report' || github.ref == 'refs/heads/main') }}
        run: |
          set -euo pipefail
          for name in status-ok status-warn status-fail status-na status-error; do
            cp -- ".github/badges/$name.svg" governance-badges/
          done

      - name: Upload README badges
        if: ${{ always() && !cancelled() && (github.ref == 'refs/heads/feature/governance-report' || github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-badges
          path: governance-badges/*.svg
          retention-days: 90
          if-no-files-found: error

      - name: Upload governance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-report
          path: governance-report/
          retention-days: 90
          if-no-files-found: ignore

  publish-governance-badges:
    needs: governance-report
    # Feature branch for testing; main for scheduled/manual production runs. Never write to main/develop.
    if: ${{ always() && !cancelled() && (github.ref == 'refs/heads/feature/governance-report' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download badge assets only
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: governance-badges
          path: ${{ runner.temp }}/governance-badges

      - name: Publish SVGs to the badge-only branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BADGE_SOURCE: ${{ runner.temp }}/governance-badges
        run: |
          set -euo pipefail
          source_branch="${SOURCE_REF#refs/heads/}"
          current_source_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${source_branch}" | cut -f1)"
          if [[ "$current_source_sha" != "$SOURCE_SHA" ]]; then
            echo 'Source branch moved during the scan; skipping outdated badge publication.'
            exit 0
          fi

          # Keep the token out of command arguments and persistent Git configuration.
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 --wrap=0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          publish_dir="$RUNNER_TEMP/governance-badges-repository"
          mkdir -p "$publish_dir"
          git -C "$publish_dir" init --quiet --initial-branch=sync/governance-badges
          git -C "$publish_dir" config user.name 'github-actions[bot]'
          git -C "$publish_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$publish_dir" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"

          if git -C "$publish_dir" ls-remote --exit-code origin refs/heads/sync/governance-badges >/dev/null 2>&1; then
            git -C "$publish_dir" fetch --no-tags origin refs/heads/sync/governance-badges
            git -C "$publish_dir" switch --quiet --force-create sync/governance-badges FETCH_HEAD
          fi

          mkdir -p "$publish_dir/.github/badges"
          cp -- "$BADGE_SOURCE"/*.svg "$publish_dir/.github/badges/"
          git -C "$publish_dir" add -- .github/badges
          if git -C "$publish_dir" diff --cached --quiet; then
            echo 'Governance badge assets are unchanged.'
            exit 0
          fi
          git -C "$publish_dir" commit --quiet -m 'chore(OSPO): refresh governance badges'
          # Never force-push; sync/governance-badges is not a report workflow push trigger.
          git -C "$publish_dir" push origin HEAD:refs/heads/sync/governance-badges
